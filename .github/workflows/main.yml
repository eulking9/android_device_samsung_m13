name: Build TWRP for Samsung M13 (Android 14)

on:
  workflow_dispatch: {}   # run manually from Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig openjdk-17-jdk python3 rsync tar
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Initialize TWRP Android 14 sources
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.0
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags

      - name: Copy device tree into source
        run: |
          cd ~/twrp
          mkdir -p device/samsung/m13
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" device/samsung/m13/

      - name: Build recovery
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_m13-eng
          mka recoveryimage

      - name: Create Odin TAR
        run: |
          cd ~/twrp/out/target/product/m13
          tar -H ustar -c recovery.img > recovery.tar

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: twrp-m13-android14
          path: |
            ~/twrp/out/target/product/m13/recovery.img
            ~/twrp/out/target/product/m13/recovery.tar
