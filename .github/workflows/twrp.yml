name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
        lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Init repo
      run: |
        mkdir ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all)

    - name: Copy device tree
      run: |
        cd ~/twrp/device
        mkdir -p samsung/m13
        cp -r $GITHUB_WORKSPACE/* samsung/m13/

    - name: Build recovery
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch omni_m13-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload recovery
      uses: actions/upload-artifact@v3
      with:
        name: twrp-recovery
        path: ~/twrp/out/target/product/m13/recovery.img
